<div class="container-fluid py-4">
  <div class="card doctor-form-card shadow-sm">
    <div class="card-header form-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Doctor Details</h4>
      
    </div>

    <div class="card-body">
      <form #doctorForm="ngForm" (ngSubmit)="onSubmit(doctorForm)">
       
        <div class="section-header">Basic Information</div>
        <div class="row gy-3">
          <div class="col-md-4">
            <label class="form-label">First Name</label>
            <input
              type="text"
              name="firstName"
              [(ngModel)]="doctorDetails.FirstName"
              required
              class="form-control"
              placeholder="Enter first name"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Last Name</label>
            <input
              type="text"
              name="lastName"
              [(ngModel)]="doctorDetails.LastName"
              required
              class="form-control"
              placeholder="Enter last name"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Date of Birth</label>
            <input
              type="date"
              name="dateOfBirth"
              [(ngModel)]="doctorDetails.DateOfBirth"
              required
              class="form-control"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Gender</label>
            <ng-select
            [items]="genders"
            name="genderId"
            bindLabel="Gender"
            bindValue="GenderId"
            placeholder="Select your Gender"
            [(ngModel)]="doctorDetails.GenderId"
            >
          </ng-select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact No</label>
            <input
              type="text"
              name="contactNo"
              [(ngModel)]="doctorDetails.ContactNo"
              required
              maxlength="10"
              pattern="^[0-9]{10}$"
              class="form-control"
              placeholder="Enter 10-digit contact"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Blood Group</label>
            <ng-select
            [items]="bloodGroups"
            name="bloodGroupId"
            bindLabel="BloodGroupName"
            bindValue="BloodGroupId"
            placeholder="Select your blood group"
            [(ngModel)]="doctorDetails.BloodGroupId"
            >
          </ng-select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Years of Experience</label>
            <input
              type="number"
              name="yearOfExperience"
              [(ngModel)]="doctorDetails.YearOfExperience"
              required
              class="form-control"
              placeholder="Enter experience"
            />
          </div>
        </div>

      
        <div class="section-header mt-5">Login Information</div>
        <div class="row gy-3">
          <div class="col-md-6">
            <label class="form-label">Email</label>
            <input
              type="email"
              name="email"
              [(ngModel)]="doctorDetails.Email"
              required
              class="form-control"
              placeholder="Enter email address"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Password</label>
            <input
              type="password"
              name="password"
              [(ngModel)]="doctorDetails.Password"
              required
              minlength="6"
              class="form-control"
              placeholder="Enter password (min 6 chars)"
            />
          </div>
        </div>

      
        <div class="section-header mt-5">Qualifications & Specializations</div>
        <div class="row gy-3">
          <div class="col-md-6">
            <label class="form-label">Qualifications</label>
            <ng-select
            [items]="qualifications"
            name="QualificationList"
            bindLabel="Degree"
            bindValue="QualificationId"
            placeholder="Select qualifications"
            [(ngModel)]="doctorDetails.QualificationsIdList"
            multiple
            >
          </ng-select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Specialization</label>
            <ng-select
            [items]="specializations"
            name="SpecializationsList"
            bindLabel="Specialization"
            bindValue="SpecializationId"
            placeholder="Select Specializations"
            [(ngModel)]="doctorDetails.SpecializationsIdList"
            multiple
            >
          </ng-select>
          </div>
        </div>

       
        <div class="section-header mt-5">Consultancy</div>
        <div class="row gy-3">
          <div class="col-md-4">
            <label class="form-label">Consultancy Fee (₹)</label>
            <input
              type="number"
              name="consultancyFee"
              [(ngModel)]="doctorDetails.ConsultancyFee"
              required
              class="form-control"
              placeholder="Enter fee"
            />
          </div>
         
        </div>
        <div class="section-header mt-5">Address</div>
        <div class="row gy-3">
          <div class="col-md-6">
            <label class="form-label">Building Name/Flat No./Street</label>
            <input
              type="text"
              name="addressLine1"
              [(ngModel)]="doctorDetails.AddressLine1"
              required
              class="form-control"
              placeholder="Enter address"
            />
          </div>
          <div class="col-md-2">
            <label class="form-label">Pincode</label>
            <input
              type="text"
              name="pincode"
              [(ngModel)]="doctorDetails.Pincode"
              required
              maxlength="6"
              pattern="^[0-9]{6}$"
              class="form-control"
              placeholder="Enter pincode"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Country</label>
            <ng-select
              [items]="countries"
              name="countryId"
              bindLabel="CountryName"
              bindValue="CountryId"
              placeholder="Select country"
              [(ngModel)]="doctorDetails.CountryId"
              >
            </ng-select>
          </div>
          <div class="col-md-4">
            <label class="form-label">State</label>
            <ng-select
            [items]="states"
            name="stateId"
            bindLabel="StateName"
            bindValue="StateId"
            placeholder="Select state"
            [(ngModel)]="doctorDetails.StateId"
            >
          </ng-select>
          </div>
          <div class="col-md-4">
            <label class="form-label">District</label>
            <ng-select
            [items]="districts"
             name="districtId"
            bindLabel="DistrictName"
            bindValue="DistrictId"
            placeholder="Select District"
            [(ngModel)]="doctorDetails.DistrictId"
            >
          </ng-select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Taluka</label>
            <ng-select
              [items]="talukas"
              name="talukaId"
              bindLabel="TalukaName"
              bindValue="TalukaId"
              placeholder="Select taluka"
              [(ngModel)]="doctorDetails.TalukaId"
              >
            </ng-select>
          </div>
        </div>

        
        <div class="section-header mt-5 d-flex justify-content-between align-items-center">
          <span>Available Slots</span>
          <button type="button" class="btn btn-outline-success btn-sm" (click)="addSlot()">
            <i class="bi bi-plus-circle"></i> Add Slot
          </button>
        </div>

        <div *ngFor="let slot of doctorDetails.AvaliableSlotesList; let i = index" class="row gy-3 align-items-end mb-2">
          <div class="col-md-3">
            <label class="form-label">Day of Week</label>
            <select
              [(ngModel)]="slot.dayOfWeek"
              name="dayOfWeek{{ i }}"
              class="form-select"
              required
            >
              <option value="">Select Day</option>
              <option *ngFor="let day of daysOfWeek" [value]="day">
                {{ day }}
              </option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Start Time</label>
            <input
              type="time"
              [(ngModel)]="slot.startTime"
              name="startTime{{ i }}"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">End Time</label>
            <input
              type="time"
              [(ngModel)]="slot.endTime"
              name="endTime{{ i }}"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-danger" (click)="removeSlot(i)">
              <i class="bi bi-trash"></i> Remove
            </button>
          </div>
        </div>

        <div class="text-end mt-5">
          <button type="reset" class="btn btn-outline-secondary me-2">Reset</button>
          <button type="submit" class="btn btn-success" [disabled]="doctorForm.invalid">
            <i class="bi bi-save"></i> Save Doctor
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
