<div class="container-fluid py-3">
  <div class="card shadow-sm">
    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
      <h4 class="mb-0">Add Doctor</h4>
      <button class="btn btn-light btn-sm" routerLink="/doctors/list">
        <i class="bi bi-arrow-left"></i> Back
      </button>
    </div>

    <div class="card-body">
      <form #doctorForm="ngForm" (ngSubmit)="onSubmit(doctorForm)">
        <!-- 🧍‍♂️ Basic Info -->
        <h5 class="text-primary mb-3 border-bottom pb-2">Basic Information</h5>
        <div class="row gy-3">
          <div class="col-md-4">
            <label class="form-label">First Name</label>
            <input
              type="text"
              name="firstName"
              [(ngModel)]="doctor.firstName"
              required
              class="form-control"
              placeholder="Enter first name"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Last Name</label>
            <input
              type="text"
              name="lastName"
              [(ngModel)]="doctor.lastName"
              required
              class="form-control"
              placeholder="Enter last name"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Date of Birth</label>
            <input
              type="date"
              name="dob"
              [(ngModel)]="doctor.dob"
              required
              class="form-control"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Gender</label>
            <select
              name="genderId"
              [(ngModel)]="doctor.genderId"
              required
              class="form-select"
            >
              <option value="">Select Gender</option>
             
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Contact No</label>
            <input
              type="text"
              name="contactNo"
              [(ngModel)]="doctor.contactNo"
              required
              maxlength="10"
              pattern="^[0-9]{10}$"
              class="form-control"
              placeholder="Enter contact number"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Blood Group</label>
            <select
              name="bloodGroupId"
              [(ngModel)]="doctor.bloodGroupId"
              required
              class="form-select"
            >
              <option value="">Select Blood Group</option>
              
            </select>
          </div>
        </div>

        <!-- 🎓 Qualification -->
        <h5 class="text-primary mt-4 mb-3 border-bottom pb-2">Qualification</h5>
        <div class="row gy-3">
          <div class="col-md-6">
            <label class="form-label">Qualification</label>
            <select
              name="qualificationId"
              [(ngModel)]="doctor.qualificationId"
              required
              class="form-select"
            >
              <option value="">Select Qualification</option>
              
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Description</label>
            <textarea
              name="qualificationDesc"
              [(ngModel)]="doctor.qualificationDesc"
              rows="2"
              class="form-control"
              placeholder="Describe qualification"
            ></textarea>
          </div>
        </div>

        <!-- 💼 Specialization -->
        <h5 class="text-primary mt-4 mb-3 border-bottom pb-2">Specialization</h5>
        <div class="row gy-3">
          <div class="col-md-6">
            <label class="form-label">Specialization</label>
            <select
              name="specializationId"
              [(ngModel)]="doctor.specializationId"
              required
              class="form-select"
            >
              <option value="">Select Specialization</option>
              
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label">Years of Experience</label>
            <input
              type="number"
              name="yearOfExperience"
              [(ngModel)]="doctor.yearOfExperience"
              required
              class="form-control"
              placeholder="Enter experience"
            />
          </div>
        </div>

        <!-- 💰 Consultancy -->
        <h5 class="text-primary mt-4 mb-3 border-bottom pb-2">Consultancy</h5>
        <div class="row gy-3">
          <div class="col-md-4">
            <label class="form-label">Consultancy Fee (₹)</label>
            <input
              type="number"
              name="consultancyFee"
              [(ngModel)]="doctor.consultancyFee"
              required
              class="form-control"
              placeholder="Enter fee"
            />
          </div>
        </div>

        <!-- 🏠 Address -->
        <h5 class="text-primary mt-4 mb-3 border-bottom pb-2">Address</h5>
        <div class="row gy-3">
          <div class="col-md-6">
            <label class="form-label">Address Line</label>
            <input
              type="text"
              name="addressLine1"
              [(ngModel)]="doctor.addressLine1"
              required
              class="form-control"
              placeholder="Enter address"
            />
          </div>
          <div class="col-md-2">
            <label class="form-label">Pincode</label>
            <input
              type="text"
              name="pincode"
              [(ngModel)]="doctor.pincode"
              required
              maxlength="6"
              pattern="^[0-9]{6}$"
              class="form-control"
              placeholder="Enter pincode"
            />
          </div>
          <div class="col-md-4">
            <label class="form-label">Country</label>
            <select
              name="countryId"
              [(ngModel)]="doctor.countryId"
              (change)="onCountryChange($event)"
              class="form-select"
              required
            >
              <option value="">Select Country</option>
             
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">State</label>
            <select
              name="stateId"
              [(ngModel)]="doctor.stateId"
              (change)="onStateChange($event)"
              class="form-select"
              required
            >
              <option value="">Select State</option>
             
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">District</label>
            <select
              name="districtId"
              [(ngModel)]="doctor.districtId"
              (change)="onDistrictChange($event)"
              class="form-select"
              required
            >
              <option value="">Select District</option>
              
            </select>
          </div>
          <div class="col-md-4">
            <label class="form-label">Taluka</label>
            <select
              name="talukaId"
              [(ngModel)]="doctor.talukaId"
              class="form-select"
              required
            >
              <option value="">Select Taluka</option>
              
            </select>
          </div>
        </div>

        <!-- 🕒 Available Slots -->
        <h5 class="text-primary mt-4 mb-3 border-bottom pb-2 d-flex justify-content-between align-items-center">
          Available Slots
          <button type="button" class="btn btn-outline-primary btn-sm" (click)="addSlot()">
            <i class="bi bi-plus-circle"></i> Add Slot
          </button>
        </h5>

        <div *ngFor="let slot of slots; let i = index" class="row gy-3 align-items-end mb-2">
          <div class="col-md-3">
            <label class="form-label">Day of Week</label>
            <select
              [(ngModel)]="slot.dayOfWeek"
              name="dayOfWeek{{ i }}"
              class="form-select"
              required
            >
              <option value="">Select Day</option>
              <option *ngFor="let day of daysOfWeek" [value]="day">
                {{ day }}
              </option>
            </select>
          </div>
          <div class="col-md-3">
            <label class="form-label">Start Time</label>
            <input
              type="time"
              [(ngModel)]="slot.startTime"
              name="startTime{{ i }}"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-3">
            <label class="form-label">End Time</label>
            <input
              type="time"
              [(ngModel)]="slot.endTime"
              name="endTime{{ i }}"
              class="form-control"
              required
            />
          </div>
          <div class="col-md-3 text-end">
            <button type="button" class="btn btn-outline-danger" (click)="removeSlot(i)">
              <i class="bi bi-trash"></i> Remove
            </button>
          </div>
        </div>

        <!-- ✅ Submit -->
        <div class="text-end mt-4">
          <button type="reset" class="btn btn-outline-secondary me-2">Reset</button>
          <button type="submit" class="btn btn-success" [disabled]="doctorForm.invalid">
            <i class="bi bi-save"></i> Save Doctor
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
